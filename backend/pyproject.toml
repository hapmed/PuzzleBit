[project]
name = "puzzlebit-backend"
version = "0.1.0"
description = "Backend de PuzzleBit: niveles, progreso, puntuaciones y ranking."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn[standard]==0.41.0",
  "sqlalchemy==2.0.45",
  "alembic==1.17.2",
  "psycopg[binary]==3.2.13",
  "pydantic==2.12.5",
  "pydantic-settings==2.11.0",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
  "ruff==0.14.10",
  "mypy==1.19.1",
]

[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"
